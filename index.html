<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Certificate Display</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 14px;
      background: #f3f4f6;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { width: min(1100px, 100%); margin: 0 auto; }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      box-shadow: 0 5px 24px rgba(0,0,0,.12);
    }
    footer {
      margin: 14px auto 0;
      max-width: 820px;
      color: #555;
      font-size: 12px;
      line-height: 1.5;
    }
    a { color: #174ea6; }
  </style>
</head>
<body>
  <main>
    <img src="./certificate-original.png" alt="Certificate display copy">
    <footer>
      Personal certificate display copy. This page is not an NPTEL verification record.
      For official verification, use the QR code or verification details issued by NPTEL.
      <a href="https://nptel.ac.in/" target="_blank" rel="noopener">NPTEL official website</a>.
    </footer>
  </main>
</body>
</html>
